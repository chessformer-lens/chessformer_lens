[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessformer_lens"
version = "0.2.0"
description = "An interpretability lens and visualizer for square-token chess transformers (MAIA-3 backend; Lc0-BT next)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]   # third-party notices live at the bottom of it
authors = [{ name = "David Litman", email = "david.litman1@gmail.com" }]
keywords = [
    "chess",
    "transformer",
    "mechanistic-interpretability",
    "interpretability",
    "maia",
    "leela",
    "lc0",
    "attention",
    "logit-lens",
    "ablation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Board Games",
]

# `maia3` (the Maia-3 model code that engine.py imports) is deliberately absent:
# it is not on PyPI, and PyPI rejects direct git URLs in dependency metadata.
# Install it alongside this package -- see the README, or requirements.txt:
#     pip install git+https://github.com/CSSLab/maia3
dependencies = [
    # >=2.4 is maia3's floor, not ours: maia3/models.py imports torch.nn.RMSNorm,
    # which was added in 2.4. Note this rules out Intel Macs, whose last wheel
    # was 2.2.2.
    "torch>=2.4",
    "numpy",
    "python-chess",
    "huggingface-hub",
    "ipython",
]

[project.optional-dependencies]
app = ["pywebview"]          # the native window (app.py)
plot = ["matplotlib"]        # the static figure layer (interp_plot.py, piece_art.py)
all = ["chessformer_lens[app,plot]"]

[project.scripts]
chessformer_lens = "chessformer_lens.app:main"
chessformer-lens = "chessformer_lens.app:main"   # the pre-0.1.2 name, kept working

[project.urls]
Homepage = "https://github.com/chessformer-lens/chessformer_lens"
Repository = "https://github.com/chessformer-lens/chessformer_lens"
Issues = "https://github.com/chessformer-lens/chessformer_lens/issues"

[tool.setuptools.packages.find]
include = ["chessformer_lens*"]

# No package-data: the pieces rasterised offline for the matplotlib figure layer
# are carried as base64 inside piece_art.py, so the wheel is pure Python.
